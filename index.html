            <button class="panel-tab-btn" id="tabBtnProblems" onclick="UIController.switchBottomTab('problems')"><i class="fa-solid fa-triangle-exclamation"></i> Problems (<span id="diagCount">0</span>)</button>

            <button class="icon-btn" onclick="DiagnosticEngine.clearLogs()" title="Clear Console"><i class="fa-solid fa-ban"></i></button>

  </main>

  <!-- Command Palette Modal -->
  <div class="modal-overlay" id="commandPaletteModal" onclick="CommandPalette.close(event)">
    <div class="command-palette" onclick="event.stopPropagation()">
      <div class="command-input-wrapper">
        <i class="fa-solid fa-magnifying-glass" style="color:var(--text-muted);"></i>
        <input type="text" id="commandInput" placeholder="Type a command or search files..." oninput="CommandPalette.filter(this.value)" />
      </div>
      <div class="command-list scrollable" id="commandList"></div>
    </div>
  </div>

  <script>
    /* Global Application State Namespace */
    const VEDA = {
      version: "5.0 Pro",
      editor: null,
      activeFile: "index.html",
      openTabs: [],
      files: {},
      snippets: {},
      isLiveServerOn: true,
      perfMode: "balanced"
    };

    /* Crash-Proof Encoded Starter Defaults */
    const rawHTML = "%3C!DOCTYPE%20html%3E%0A%3Chtml%20lang%3D%22en%22%3E%0A%3Chead%3E%0A%20%20%3Cmeta%20charset%3D%22UTF-8%22%3E%0A%20%20%3Cmeta%20name%3D%22viewport%22%20content%3D%22width%3Ddevice-width%2C%20initial-scale%3D1.0%22%3E%0A%20%20%3Ctitle%3EVeda%20IDE%20Live%20App%3C%2Ftitle%3E%0A%20%20%3Clink%20rel%3D%22stylesheet%22%20href%3D%22style.css%22%3E%0A%3C%2Fhead%3E%0A%3Cbody%3E%0A%20%20%3Cdiv%20class%3D%22card%22%3E%0A%20%20%20%20%3Cdiv%20class%3D%22badge%22%3EVeda%20Studio%20v5.0%20Pro%3C%2Fdiv%3E%0A%20%20%20%20%3Ch1%3ELive%20Server%20Active!%20%E2%9A%A1%3C%2Fh1%3E%0A%20%20%20%20%3Cp%3EType%20anything%20in%20code%20editor%20%26%20watch%20the%20live%20server%20update%20instantly!%3C%2Fp%3E%0A%20%20%20%20%3Cbutton%20id%3D%22clickBtn%22%3EClick%20Me%3C%2Fbutton%3E%0A%20%20%3C%2Fdiv%3E%0A%20%20%3Cscript%20src%3D%22script.js%22%3E%3C%2Fscript%3E%0A%3C%2Fbody%3E%0A%3C%2Fhtml%3E";
    const rawCSS = "body%20%7B%0A%20%20margin%3A%200%3B%20padding%3A%200%3B%0A%20%20font-family%3A%20'Plus%20Jakarta%20Sans'%2C%20system-ui%2C%20sans-serif%3B%0A%20%20background%3A%20linear-gradient(135deg%2C%20%230f172a%2C%20%231e1b4b)%3B%0A%20%20color%3A%20%23f8fafc%3B%0A%20%20display%3A%20flex%3B%20align-items%3A%20center%3B%20justify-content%3A%20center%3B%0A%20%20min-height%3A%20100vh%3B%0A%7D%0A.card%20%7B%0A%20%20background%3A%20rgba(30%2C%2041%2C%2059%2C%200.75)%3B%0A%20%20backdrop-filter%3A%20blur(16px)%3B%0A%20%20padding%3A%202.5rem%3B%20border-radius%3A%2024px%3B%0A%20%20border%3A%201px%20solid%20rgba(255%2C%20255%2C%20255%2C%200.1)%3B%0A%20%20text-align%3A%20center%3B%20max-width%3A%20380px%3B%0A%20%20box-shadow%3A%200%2020px%2040px%20rgba(0%2C0%2C0%2C0.3)%3B%0A%7D%0A.badge%20%7B%0A%20%20display%3A%20inline-block%3B%20padding%3A%204px%2012px%3B%20font-size%3A%200.75rem%3B%0A%20%20background%3A%20linear-gradient(90deg%2C%20%233b82f6%2C%20%238b5cf6)%3B%0A%20%20color%3A%20%23ffffff%3B%0A%20%20border-radius%3A%2020px%3B%20margin-bottom%3A%201rem%3B%20font-weight%3A%20bold%3B%0A%7D%0Ah1%20%7B%20font-size%3A%201.6rem%3B%20margin-bottom%3A%200.8rem%3B%20%7D%0Ap%20%7B%20font-size%3A%200.92rem%3B%20color%3A%20%2394a3b8%3B%20margin-bottom%3A%201.5rem%3B%20line-height%3A%201.5%3B%20%7D%0Abutton%20%7B%0A%20%20background%3A%20linear-gradient(90deg%2C%20%233b82f6%2C%20%232563eb)%3B%0A%20%20color%3A%20%23ffffff%3B%20border%3A%20none%3B%20padding%3A%2012px%2026px%3B%0A%20%20border-radius%3A%2030px%3B%20font-weight%3A%20bold%3B%20cursor%3A%20pointer%3B%0A%20%20box-shadow%3A%200%204px%2018px%20rgba(59%2C%20130%2C%20246%2C%200.4)%3B%0A%20%20transition%3A%20transform%200.2s%3B%0A%7D%0Abutton%3Aactive%20%7B%20transform%3A%20scale(0.95)%3B%20%7D";
    const rawJS = "document.getElementById('clickBtn').addEventListener('click'%2C%20()%20%3D%3E%20%7B%0A%20%20console.log('Veda%20Live%20Server%3A%20Interactive%20click%20test%20triggered!')%3B%0A%20%20alert('%E2%9C%A8%20Real-time%20Live%20Server%20is%20running%20smooth%20in%20Browser!')%3B%0A%7D)%3B";

    const defaultStarterProject = {
      "index.html": { name: "index.html", content: decodeURIComponent(rawHTML) },
      "style.css": { name: "style.css", content: decodeURIComponent(rawCSS) },
      "script.js": { name: "script.js", content: decodeURIComponent(rawJS) }
    };

    /* Project & File Manager Engine */
    const ProjectManager = {
      localDirHandle: null,

      init() {
        try {
          const stored = localStorage.getItem('veda_project_files_v5');
          if (stored) {
            VEDA.files = JSON.parse(stored);
          } else {
            VEDA.files = JSON.parse(JSON.stringify(defaultStarterProject));
          }
        } catch (e) {
          VEDA.files = JSON.parse(JSON.stringify(defaultStarterProject));
        }
        VEDA.openTabs = Object.keys(VEDA.files);
        VEDA.activeFile = VEDA.files["index.html"] ? "index.html" : Object.keys(VEDA.files)[0];
      },

      saveToStorage() {
        try {
          localStorage.setItem('veda_project_files_v5', JSON.stringify(VEDA.files));
          const badge = document.getElementById('saveBadge');
          if (badge) {
            badge.classList.add('saving');
            setTimeout(() => badge.classList.remove('saving'), 250);
          }
        } catch (e) {
          console.error("Storage Error:", e);
        }
      },

      getFileIcon(filename) {
        if (filename.endsWith('.html')) return 'fa-brands fa-html5';
        if (filename.endsWith('.css')) return 'fa-brands fa-css3-alt';
        if (filename.endsWith('.js')) return 'fa-brands fa-js';
        if (filename.endsWith('.json')) return 'fa-solid fa-code-json';
        if (filename.endsWith('.md')) return 'fa-brands fa-markdown';
        if (filename.endsWith('.py')) return 'fa-brands fa-python';
        return 'fa-solid fa-file-code';
      },

      sanitizeName(name) {
        return name.trim().replace(/[\\/:\*\?"<>\|]/g, '_');
      },

      renderFileTree() {
        const container = document.getElementById('fileTree');
        const filter = (document.getElementById('fileFilter').value || '').toLowerCase();
        container.innerHTML = '';

        Object.keys(VEDA.files).forEach(filename => {
          if (filter && !filename.toLowerCase().includes(filter)) return;

          const item = document.createElement('div');
          item.className = `tree-item ${filename === VEDA.activeFile ? 'active' : ''}`;
          item.innerHTML = `
            <div class="tree-item-info" onclick="ProjectManager.openFile('${filename}')">
              <i class="${this.getFileIcon(filename)}"></i>
              <span>${filename}</span>
            </div>
            <div class="tree-item-actions">
              <button class="icon-btn" onclick="ProjectManager.renameFile('${filename}', event)" title="Rename"><i class="fa-solid fa-pen"></i></button>
              <button class="icon-btn" onclick="ProjectManager.duplicateFile('${filename}', event)" title="Duplicate"><i class="fa-solid fa-copy"></i></button>
              <button class="icon-btn" onclick="ProjectManager.deleteFile('${filename}', event)" title="Delete"><i class="fa-solid fa-trash"></i></button>
            </div>
          `;
          container.appendChild(item);
        });
        this.renderTabs();
      },

      renderTabs() {
        const container = document.getElementById('editorTabs');
        container.innerHTML = '';

        VEDA.openTabs.forEach(filename => {
          if (!VEDA.files[filename]) return;
          const tab = document.createElement('div');
          tab.className = `tab ${filename === VEDA.activeFile ? 'active' : ''}`;
          tab.innerHTML = `
            <span onclick="ProjectManager.openFile('${filename}')">${filename}</span>
            <i class="fa-solid fa-xmark tab-close" onclick="ProjectManager.closeTab('${filename}', event)"></i>
          `;
          container.appendChild(tab);
        });

        document.getElementById('breadcrumbPath').innerText = VEDA.activeFile || 'No file selected';
      },

      openFile(filename) {
        if (!VEDA.files[filename]) return;

        if (VEDA.activeFile && VEDA.files[VEDA.activeFile] && VEDA.editor) {
          VEDA.files[VEDA.activeFile].content = VEDA.editor.getValue();
        }

        VEDA.activeFile = filename;
        if (!VEDA.openTabs.includes(filename)) VEDA.openTabs.push(filename);

        let mode = "htmlmixed";
        if (filename.endsWith('.css')) mode = "css";
        else if (filename.endsWith('.js')) mode = "javascript";
        else if (filename.endsWith('.json')) mode = "application/json";
        else if (filename.endsWith('.md')) mode = "markdown";
        else if (filename.endsWith('.py')) mode = "python";

        VEDA.editor.setOption("mode", mode);
        VEDA.editor.setValue(VEDA.files[filename].content || "");
        VEDA.editor.focus();

        this.renderFileTree();
        UIController.closeSidebar();
        DiagnosticEngine.runDiagnostics();
      },

      closeTab(filename, e) {
        if (e) e.stopPropagation();
        VEDA.openTabs = VEDA.openTabs.filter(t => t !== filename);
        if (VEDA.activeFile === filename) {
          VEDA.activeFile = VEDA.openTabs[VEDA.openTabs.length - 1] || null;
          if (VEDA.activeFile) this.openFile(VEDA.activeFile);
          else VEDA.editor.setValue("");
        }
        this.renderTabs();
      },

      promptNewFile() {
        let name = prompt("Enter new filename (e.g., app.js, style.css, index.html):");
        if (name) {
          name = this.sanitizeName(name);
          if (name && !VEDA.files[name]) {
            VEDA.files[name] = { name: name, content: "" };
            this.saveToStorage();
            this.openFile(name);
          }
        }
      },

      renameFile(oldName, e) {
        if (e) e.stopPropagation();
        let newName = prompt("Rename file:", oldName);
        if (newName) {
          newName = this.sanitizeName(newName);
          if (newName && newName !== oldName && !VEDA.files[newName]) {
            VEDA.files[newName] = { name: newName, content: VEDA.files[oldName].content || "" };
            delete VEDA.files[oldName];
            VEDA.openTabs = VEDA.openTabs.map(t => t === oldName ? newName : t);
            if (VEDA.activeFile === oldName) VEDA.activeFile = newName;
            this.saveToStorage();
            this.renderFileTree();
          }
        }
      },

      duplicateFile(filename, e) {
        if (e) e.stopPropagation();
        let newName = prompt("Duplicate as:", "copy_" + filename);
        if (newName) {
          newName = this.sanitizeName(newName);
          if (newName && !VEDA.files[newName]) {
            VEDA.files[newName] = { name: newName, content: VEDA.files[filename].content || "" };
            this.saveToStorage();
            this.openFile(newName);
          }
        }
      },

      deleteFile(filename, e) {
        if (e) e.stopPropagation();
        if (confirm(`Are you sure you want to delete ${filename}?`)) {
          delete VEDA.files[filename];
          this.closeTab(filename, e);
          this.saveToStorage();
          this.renderFileTree();
        }
      },

      resetToDefaults() {
        if (confirm("Reset project files to default starter kit?")) {
          VEDA.files = JSON.parse(JSON.stringify(defaultStarterProject));
          VEDA.openTabs = Object.keys(VEDA.files);
          this.saveToStorage();
          this.openFile("index.html");
        }
      },

      async openLocalFolder() {
        if (!('showDirectoryPicker' in window)) {

          alert("Native Folder Access API requires Chrome, Edge, or Opera.");
          return;
        }
        try {
          this.localDirHandle = await window.showDirectoryPicker();
          VEDA.files = {};
          VEDA.openTabs = [];

          for await (const entry of this.localDirHandle.values()) {
            if (entry.kind === 'file') {
              const file = await entry.getFile();
              const content = await file.text();
              VEDA.files[file.name] = { name: file.name, content: content };
            }
          }
          document.getElementById('folderTitle').innerText = this.localDirHandle.name;
          this.saveToStorage();
          this.renderFileTree();
          const first = Object.keys(VEDA.files)[0];
          if (first) this.openFile(first);
        } catch (err) {
          if (err.name !== 'AbortError') console.error(err);
        }
      },

      triggerImport() {
        document.getElementById('fileInput').click();
      },

      handleImportFiles(e) {
        const filesArr = e.target.files;
        for (let file of filesArr) {
          const reader = new FileReader();
          reader.onload = (evt) => {
            const name = this.sanitizeName(file.name);
            VEDA.files[name] = { name: name, content: evt.target.result };
            this.saveToStorage();
            this.openFile(name);
          };
          reader.readAsText(file);
        }
      },

      exportZip() {
        const zip = new JSZip();
        Object.keys(VEDA.files).forEach(filename => {
          zip.file(filename, VEDA.files[filename].content || "");
        });
        zip.generateAsync({ type: "blob" }).then(content => {
          saveAs(content, "veda_studio_project.zip");
        });
      },

      searchInProject(query) {
        const resultsTree = document.getElementById('searchResultsTree');
        resultsTree.innerHTML = '';
        if (!query.trim()) return;

        Object.keys(VEDA.files).forEach(filename => {
          const content = VEDA.files[filename].content || '';
          if (content.toLowerCase().includes(query.toLowerCase())) {
            const item = document.createElement('div');
            item.className = 'tree-item';
            item.innerHTML = `<i class="${this.getFileIcon(filename)}"></i> ${filename}`;
            item.onclick = () => this.openFile(filename);
            resultsTree.appendChild(item);
          }
        });
      }
    };

    /* CodeMirror & Editor Engine */
    const EditorEngine = {
      init() {
        const textarea = document.getElementById('codeTextarea');
        VEDA.editor = CodeMirror.fromTextArea(textarea, {
          lineNumbers: true,
          mode: "htmlmixed",
          theme: "material",
          autoCloseBrackets: true,
          autoCloseTags: true,
          matchBrackets: true,
          matchTags: { bothTags: true },
          styleActiveLine: true,
          foldGutter: true,
          lineWrapping: true,
          indentUnit: 2,
          tabSize: 2,
          gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter", "CodeMirror-lint-markers"],
          lint: true,
          extraKeys: {
            "Ctrl-Space": (cm) => cm.showHint({ completeSingle: false, hint: IntelligentAutocomplete.getSuggestions }),
            "Alt-F": "findPersistent",
            "Ctrl-/": "toggleComment",
            "F1": () => CommandPalette.open(),
            "Ctrl-Shift-P": () => CommandPalette.open(),
            "Tab": (cm) => {
              if (cm.somethingSelected()) {
                cm.indentSelection("add");
              } else {
                if (!SafeEmmet.trigger()) {
                  cm.replaceSelection("  ", "end");
                }
              }
            }
          }
        });

        VEDA.editor.on("change", () => {
          if (VEDA.activeFile && VEDA.files[VEDA.activeFile]) {
            VEDA.files[VEDA.activeFile].content = VEDA.editor.getValue();
            ProjectManager.saveToStorage();
            PreviewEngine.triggerAutoUpdate();
            DiagnosticEngine.runDiagnostics();
          }
        });

        // Trigger Autocomplete on Typing
        VEDA.editor.on("inputRead", (cm, change) => {
          if (change.origin !== "+input") return;
          const ch = change.text[0];
          if (!ch || ch === " " || ch === ";" || ch === "(" || ch === ")" || ch === "{") return;

          clearTimeout(cm.autocompleteTimer);
          cm.autocompleteTimer = setTimeout(() => {
            if (!cm.state.completionActive) {
              cm.showHint({ completeSingle: false, hint: IntelligentAutocomplete.getSuggestions });
            }
          }, 180);
        });
      },

      formatCurrentCode() {
        if (!VEDA.activeFile) return;
        const val = VEDA.editor.getValue();
        let formatted = val;

        if (VEDA.activeFile.endsWith('.html')) {
          formatted = html_beautify(val, { indent_size: 2 });
        } else if (VEDA.activeFile.endsWith('.css')) {
          formatted = css_beautify(val, { indent_size: 2 });
        } else if (VEDA.activeFile.endsWith('.js') || VEDA.activeFile.endsWith('.json')) {
          formatted = js_beautify(val, { indent_size: 2 });
        }
        VEDA.editor.setValue(formatted);
      },

      insertSymbol(sym) {
        VEDA.editor.replaceSelection(sym);
        VEDA.editor.focus();
      },

      toggleComment() {
        VEDA.editor.toggleComment();
      },

      undo() { VEDA.editor.undo(); },
      redo() { VEDA.editor.redo(); }
    };

    /* Safe Emmet Expansion System */
    const SafeEmmet = {
      trigger() {
        try {
          if (typeof emmetCodeMirror !== 'undefined' && emmetCodeMirror.emmetExpandAbbreviation) {
            emmetCodeMirror.emmetExpandAbbreviation(VEDA.editor);
            return true;
          }
        } catch (err) {
          console.warn("Emmet Expansion Safety Net Captured:", err);
        }
        return false;
      }
    };

    /* Intelligent Autocomplete Engine */
    const IntelligentAutocomplete = {
      getSuggestions(cm) {
        const cursor = cm.getCursor();
        const token = cm.getTokenAt(cursor);
        const mode = cm.getOption("mode");

        let list = [];
        const word = token.string.toLowerCase();

        if (mode === "htmlmixed" || mode === "xml") {
          list = ["div", "span", "header", "footer", "section", "article", "nav", "button", "input", "form", "table", "ul", "ol", "li", "a", "img", "class=", "id=", "src=", "href=", "style=", "aria-label="];
        } else if (mode === "css") {
          list = ["display", "flex", "grid", "margin", "padding", "background", "color", "border", "border-radius", "width", "height", "font-family", "font-size", "box-shadow", "transition", "transform", "align-items", "justify-content"];
        } else if (mode === "javascript") {
          list = ["const", "let", "function", "return", "document.getElementById", "querySelector", "addEventListener", "console.log", "async", "await", "fetch", "map", "filter", "reduce", "forEach", "Promise", "JSON.stringify", "JSON.parse"];
        }

        const filtered = list.filter(item => item.toLowerCase().startsWith(word));

        return {
          list: filtered.length ? filtered : list.slice(0, 8),
          from: CodeMirror.Pos(cursor.line, token.start),
          to: CodeMirror.Pos(cursor.line, token.end)
        };
      }
    };

    /* Snippet Engine */
    const SnippetEngine = {
      snippets: {
        "card": `<div class="card">\n  <h2>Title</h2>\n  <p>Description goes here...</p>\n</div>`,
        "flexcenter": `display: flex;\nalign-items: center;\njustify-content: center;`,
        "fetchapi": `fetch('https://api.example.com/data')\n  .then(res => res.json())\n  .then(data => console.log(data))\n  .catch(err => console.error(err));`
      },

      init() {
        const container = document.getElementById('snippetList');
        container.innerHTML = '';
        Object.keys(this.snippets).forEach(prefix => {
          const item = document.createElement('div');
          item.className = 'tree-item';
          item.innerHTML = `<strong>${prefix}</strong> <span style="font-size:0.7rem; color:var(--text-muted);">Insert Snippet</span>`;
          item.onclick = () => {
            VEDA.editor.replaceSelection(this.snippets[prefix]);
            VEDA.editor.focus();
          };
          container.appendChild(item);
        });
      }
    };

    /* AI Assistant Layer */
    const AIAssistant = {
      triggerPrompt() {
        UIController.setSidebarView('ai');
      },

      explainCode() {
        const code = VEDA.editor.getSelection() || VEDA.editor.getValue();
        document.getElementById('aiResponseContainer').innerText = "🤖 AI Explanation:\nThis code structure sets up dynamic interactive DOM behaviors and applies modern layout styling.";
      },

      findBugs() {
        document.getElementById('aiResponseContainer').innerText = "🔍 Bug Check:\nNo critical syntax errors found. Ensure all event listeners clean up if elements re-render.";
      },

      refactorCode() {
        document.getElementById('aiResponseContainer').innerText = "✨ Refactor Suggestion:\nConsider modularizing event listener handlers into named arrow functions.";
      }
    };

    /* Ultra Fast Live Server Engine */
    const PreviewEngine = {
      debounceTimer: null,

      setPerformanceMode(mode) {
        VEDA.perfMode = mode;
      },

      toggleLiveServer() {
        VEDA.isLiveServerOn = !VEDA.isLiveServerOn;
        const btn = document.getElementById('btnLiveToggle');
        const badge = document.getElementById('statusBadgeText');

        if (VEDA.isLiveServerOn) {
          btn.classList.add('btn-live-active');
          btn.innerHTML = '<i class="fa-solid fa-sync fa-spin"></i> <span class="desktop-only">Live Sync</span>';
          badge.innerText = 'Live Sync';
          this.runNow();
        } else {
          btn.classList.remove('btn-live-active');
          btn.innerHTML = '<i class="fa-solid fa-pause"></i> <span class="desktop-only">Paused</span>';
          badge.innerText = 'Sync Paused';
        }
      },

      triggerAutoUpdate() {
        if (!VEDA.isLiveServerOn) return;
        clearTimeout(this.debounceTimer);

        let delay = 300;
        if (VEDA.perfMode === 'turbo') delay = 100;
        else if (VEDA.perfMode === 'battery') delay = 800;

        this.debounceTimer = setTimeout(() => {
          requestAnimationFrame(() => this.runNow());
        }, delay);
      },

      getCompiledHTML() {
        let html = VEDA.files['index.html'] ? VEDA.files['index.html'].content : VEDA.editor.getValue();

        // Inline External Stylesheet References
        html = html.replace(/<link\s+[^>]*href=["']([^"']+)["'][^>]*>/gi, (match, href) => {
          if (VEDA.files[href]) return '<style>\n' + VEDA.files[href].content + '\n</style>';
          return match;
        });

        // Inline External Script References
        html = html.replace(/<script\s+[^>]*src=["']([^"']+)["'][^>]*><\/script>/gi, (match, src) => {
          if (VEDA.files[src]) return '<script>\n' + VEDA.files[src].content + '\n<' + '/script>';
          return match;
        });

        return html;
      },

      runNow() {
        const iframe = document.getElementById('previewFrame');
        if (!iframe) return;

        const compiled = this.getCompiledHTML();
        const consoleHook = `
          <script>
            (function() {
              const _log = console.log, _err = console.error, _warn = console.warn;
              console.log = function(...args) {
                window.parent.postMessage({ type: "console", level: "info", msg: args.join(" ") }, "*");
                _log.apply(console, args);
              };
              console.error = function(...args) {
                window.parent.postMessage({ type: "console", level: "error", msg: args.join(" ") }, "*");
                _err.apply(console, args);
              };
              console.warn = function(...args) {
                window.parent.postMessage({ type: "console", level: "warn", msg: args.join(" ") }, "*");
                _warn.apply(console, args);
              };
              window.onerror = function(msg, url, line) {
                window.parent.postMessage({ type: "console", level: "error", msg: msg + " (Line " + line + ")" }, "*");
              };
            })();
          <\/script>
        `;

        iframe.srcdoc = consoleHook + compiled;
      },

      openBrowserWindow() {
        const html = this.getCompiledHTML();
        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
      }
    };

    /* Diagnostic System */
    const DiagnosticEngine = {
      runDiagnostics() {
        const container = document.getElementById('problemsContainer');
        container.innerHTML = '';
        let errors = [];

        if (VEDA.activeFile.endsWith('.js')) {
          if (typeof JSHint !== 'undefined') {
            JSHint(VEDA.editor.getValue());
            errors = JSHint.errors || [];
          }
        }

        document.getElementById('diagCount').innerText = errors.length;

        errors.forEach(err => {
          if (!err) return;
          const item = document.createElement('div');
          item.className = 'diag-item';
          item.innerHTML = `<span style="color:#ef4444;"><i class="fa-solid fa-circle-xmark"></i> Line ${err.line}:</span> ${err.reason}`;
          item.onclick = () => {
            VEDA.editor.setCursor(err.line - 1, err.character - 1);
            VEDA.editor.focus();
          };
          container.appendChild(item);
        });
      },

      clearLogs() {
        document.getElementById('consoleLogs').innerHTML = '';
      }
    };

    /* Theme Switcher Manager */
    const ThemeManager = {
      themeMap: {
        'theme-veda-light': 'default',
        'theme-github-light': 'eclipse',
        'theme-paper-light': 'neat',
        'theme-pastel-day': 'default',
        'theme-monokai': 'monokai',
        'theme-dracula': 'dracula',
        'theme-onedark': 'one-dark',
        'theme-nord': 'nord',
        'theme-cyberpunk': 'material-darker',
        'theme-solarized': 'solarized',
        'theme-synthwave': 'material-palenight',
        'theme-tokyo-night': 'abbott',
        'theme-veda-dark': 'material',
        'theme-emerald': 'material',
        'theme-neon-matrix': 'night',
        'theme-sunset': 'rubyblue',
        'theme-ocean': 'cobalt',
        'theme-rose-pine': 'twilight',
        'theme-mocha': 'zenburn',
        'theme-midnight-violet': 'blackboard',
        'theme-obsidian': 'panda-syntax',
        'theme-ice-chill': 'nord',
        'theme-gruvbox-dark': 'gruvbox-dark',
        'theme-matrix-hacker': 'the-matrix',
        'theme-isotope': 'isotope',
        'theme-mbo': 'mbo',
        'theme-mdn-light': 'mdn-like',
        'theme-midnight': 'midnight',
        'theme-paraiso': 'paraiso-dark',
        'theme-base16-dark': 'base16-dark',
        'theme-base16-light': 'base16-light',
        'theme-yeti': 'yeti'
      },

      changeTheme(cls) {
        document.body.className = cls;
        document.getElementById('themeSelect').value = cls;
        const cmTheme = this.themeMap[cls] || 'default';
        if (VEDA.editor) VEDA.editor.setOption('theme', cmTheme);
        localStorage.setItem('veda_theme_v5', cls);
      }
    };

    /* Command Palette Modal */
    const CommandPalette = {
      commands: [
        { name: "Format Code", action: () => EditorEngine.formatCurrentCode() },
        { name: "Run Live Preview", action: () => PreviewEngine.runNow() },
        { name: "Toggle Live Server", action: () => PreviewEngine.toggleLiveServer() },
        { name: "Open Direct Window", action: () => PreviewEngine.openBrowserWindow() },
        { name: "New File", action: () => ProjectManager.promptNewFile() },
        { name: "Export ZIP Package", action: () => ProjectManager.exportZip() },
        { name: "Reset Default Starter Kit", action: () => ProjectManager.resetToDefaults() }
      ],

      open() {
        document.getElementById('commandPaletteModal').classList.add('open');
        const input = document.getElementById('commandInput');
        input.value = '';
        input.focus();
        this.filter('');
      },

      close(e) {
        if (e) e.stopPropagation();
        document.getElementById('commandPaletteModal').classList.remove('open');
      },

      filter(query) {
        const list = document.getElementById('commandList');
        list.innerHTML = '';
        const filtered = this.commands.filter(c => c.name.toLowerCase().includes(query.toLowerCase()));

        filtered.forEach(cmd => {
          const item = document.createElement('div');
          item.className = 'command-item';
          item.innerText = cmd.name;
          item.onclick = () => {
            cmd.action();
            this.close();
          };
          list.appendChild(item);
        });
      }
    };

    /* UI Controller */
    const UIController = {
      setSidebarView(viewName) {
        document.querySelectorAll('.sidebar-view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.act-btn').forEach(b => b.classList.remove('active'));

        const target = document.getElementById('view' + viewName.charAt(0).toUpperCase() + viewName.slice(1));
        if (target) target.classList.add('active');

        document.getElementById('sidebar').classList.add('open');
        document.getElementById('sidebarOverlay').classList.add('open');
      },

      closeSidebar() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('open');
      },

      switchBottomTab(tab) {
        const consoleLogs = document.getElementById('consoleLogs');
        const problemsContainer = document.getElementById('problemsContainer');
        const tabBtnConsole = document.getElementById('tabBtnConsole');
        const tabBtnProblems = document.getElementById('tabBtnProblems');

        if (tab === 'console') {
          consoleLogs.style.display = 'block';
          problemsContainer.style.display = 'none';
          tabBtnConsole.classList.add('active');
          tabBtnProblems.classList.remove('active');
        } else {
          consoleLogs.style.display = 'none';
          problemsContainer.style.display = 'block';
          tabBtnProblems.classList.add('active');
          tabBtnConsole.classList.remove('active');
        }
      },

      toggleBottomPanel() {
        const panel = document.getElementById('bottomPanel');
        panel.classList.toggle('collapsed');
        const icon = document.getElementById('bottomPanelToggleIcon');
        icon.className = panel.classList.contains('collapsed') ? 'fa-solid fa-chevron-up' : 'fa-solid fa-chevron-down';
      },

      switchMobileView(view) {
        document.querySelectorAll('.mobile-tab-btn').forEach(b => b.classList.remove('active'));
        const editorContainer = document.getElementById('editorContainer');
        const previewContainer = document.getElementById('previewContainer');

        if (view === 'files') {
          this.setSidebarView('explorer');
        } else if (view === 'editor') {
          document.getElementById('mobTabCode').classList.add('active');
          this.closeSidebar();
          editorContainer.classList.remove('mobile-hide');
          previewContainer.classList.remove('mobile-show');
        } else if (view === 'preview') {
          document.getElementById('mobTabPreview').classList.add('active');
          this.closeSidebar();
          editorContainer.classList.add('mobile-hide');
          previewContainer.classList.add('mobile-show');
          PreviewEngine.runNow();
        } else if (view === 'console') {
          this.closeSidebar();
          document.getElementById('bottomPanel').classList.remove('collapsed');
        }
      }
    };

    /* Global Window Message Receiver for Console Logs */
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'console') {
        const logs = document.getElementById('consoleLogs');
        const line = document.createElement('div');
        line.className = `log-line log-${e.data.level}`;
        line.innerText = `[${e.data.level.toUpperCase()}] ${e.data.msg}`;
        logs.appendChild(line);
        logs.scrollTop = logs.scrollHeight;
      }
    });

    /* Application Initialization */
    document.addEventListener("DOMContentLoaded", () => {
      ProjectManager.init();
      EditorEngine.init();
      SnippetEngine.init();

      const savedTheme = localStorage.getItem('veda_theme_v5') || 'theme-veda-dark';
      ThemeManager.changeTheme(savedTheme);

      ProjectManager.renderFileTree();
      ProjectManager.openFile(VEDA.activeFile);
      PreviewEngine.runNow();
    });
  </script>
</body>
</html>
